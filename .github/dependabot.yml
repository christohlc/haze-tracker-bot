# Weekly PRs that bump the pinned action SHAs and npm dev-dependencies.
# Security updates for npm come separately, as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
