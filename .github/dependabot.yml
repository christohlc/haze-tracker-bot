# Weekly PRs that bump the pinned action SHAs and npm dev-dependencies.
# Security updates for npm come separately, as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # svelte-check 4 accepts TypeScript 5 and 6 only; 7 broke npm ci (and with it the tick).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm-minor:
        update-types: [minor, patch]
