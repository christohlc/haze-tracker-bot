# Heartbeat, every 15 minutes. Telegram Serverless has no built-in scheduler, so GitHub Actions
# runs endpoints/tick in the bot's cloud environment (pattern from telegram-assistant-bot).
#
# Needs the repo secret TGCLOUD_TOKEN (the CLI access token from @BotFather).
#
# What starts it: an external cron (cron-job.org) calls the workflow_dispatch API at :12, :27,
# :42 and :57; setup in README.md#the-15-minute-tick. GitHub's own `schedule` is best effort and
# drops most runs: on 16 Oct 2026 it fired 1 of 31 slots. It stays below as a backstop for when
# the external cron is down. A dispatch and a scheduled run in the same slot just queue (the
# concurrency group), and the second one finds NEA and news cached.
#
# Every 15 min so alerts left over from a run (time budget, rate limit) go out soon after.
# NEA and news are fetched about once an hour, so the extra runs are cheap.
# Cost note: the repo is public, so Actions minutes are free. If it ever goes private again,
# this is ~2,900 billed min/month (over the 2,000 free); dispatch at :12 and :42 only instead.
#
# GitHub pauses scheduled workflows in a public repo after 60 days without repo activity, and a
# paused workflow can't be dispatched either. The weekly keepalive job re-enables this workflow
# through the API, which counts as activity (the approach of the keepalive-workflow action,
# without the third-party dependency). It runs on a dispatch with keepalive=true too, so the
# external cron can call it weekly in case GitHub drops the scheduled one.
name: tick

on:
  schedule:
    - cron: '12,27,42,57 * * * *' # NEA publishes ~15 min past the hour; off the congested :00 slot
    - cron: '33 3 * * 1' # keepalive, Mondays 11:33 SGT
  workflow_dispatch:
    inputs:
      keepalive:
        description: Re-enable the workflow instead of ticking
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tick-${{ (github.event.schedule == '33 3 * * 1' || inputs.keepalive) && 'keepalive' || 'run' }}
  cancel-in-progress: false

jobs:
  tick:
    if: github.event.schedule != '33 3 * * 1' && !inputs.keepalive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts # no install scripts in the job that holds the token
      - run: npx tgcloud run endpoints/tick
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}

  keepalive:
    if: github.event.schedule == '33 3 * * 1' || inputs.keepalive
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/tick.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
