# Heartbeat, every 15 minutes. Telegram Serverless has no built-in scheduler, so GitHub Actions
# runs endpoints/tick in the bot's cloud environment (pattern from telegram-assistant-bot).
#
# Needs the repo secret TGCLOUD_TOKEN (the CLI access token from @BotFather).
#
# Every 15 min so alerts left over from a run (time budget, rate limit) go out soon after.
# NEA and news are fetched about once an hour, so the extra runs are cheap.
# Cost note: the repo is public, so Actions minutes are free. If it ever goes private again,
# this is ~2,900 billed min/month (over the 2,000 free); use '12,42 * * * *' instead.
# GitHub may delay scheduled runs at busy times; /haze and the Mini App refetch on their own
# when the snapshot is stale.
#
# GitHub pauses scheduled workflows in a public repo after 60 days without repo activity.
# The weekly keepalive job re-enables this workflow through the API, which counts as activity
# (the approach of the keepalive-workflow action, without the third-party dependency).
name: tick

on:
  schedule:
    - cron: '12,27,42,57 * * * *' # NEA publishes ~15 min past the hour; off the congested :00 slot
    - cron: '33 3 * * 1' # keepalive, Mondays 11:33 SGT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tick-${{ github.event.schedule == '33 3 * * 1' && 'keepalive' || 'run' }}
  cancel-in-progress: false

jobs:
  tick:
    if: github.event.schedule != '33 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts # no install scripts in the job that holds the token
      - run: npx tgcloud run endpoints/tick
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}

  keepalive:
    if: github.event.schedule == '33 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/tick.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
