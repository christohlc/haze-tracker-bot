<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- BotFather welcome picture (640x360). Artwork matches public/logo.svg. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8fdc"/>
      <stop offset="0.55" stop-color="#a9b8c4"/>
      <stop offset="1" stop-color="#e2b84a"/>
    </linearGradient>
    <radialGradient id="shell" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#c88b4f"/>
      <stop offset="0.6" stop-color="#9a6332"/>
      <stop offset="1" stop-color="#6a4120"/>
    </radialGradient>
    <clipPath id="nut">
      <path d="M256 82C330 86 398 158 398 246C398 318 340 366 256 366C172 366 114 318 114 246C114 158 182 86 256 82Z"/>
    </clipPath>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1b2f4a" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <ellipse cx="320" cy="150" rx="360" ry="22" fill="#efe7d6" opacity="0.45" filter="url(#blur)"/>

  <!-- hazelnut, logo coordinates scaled into the left half -->
  <g transform="translate(-10 4) scale(0.68)">
    <g clip-path="url(#nut)">
      <rect x="100" y="70" width="312" height="310" fill="url(#shell)"/>
      <g fill="none" stroke="#5c391b" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round">
        <path d="M256 90C230 160 220 230 222 300"/>
        <path d="M256 90C296 160 312 230 308 300"/>
      </g>
      <path d="M100 288C160 262 352 262 412 288L412 380L100 380Z" fill="#dcbc84"/>
      <g fill="#b48b52">
        <circle cx="180" cy="300" r="6"/><circle cx="222" cy="292" r="6"/><circle cx="264" cy="290" r="6"/>
        <circle cx="306" cy="294" r="6"/><circle cx="344" cy="304" r="6"/><circle cx="200" cy="322" r="6"/>
        <circle cx="244" cy="316" r="6"/><circle cx="288" cy="318" r="6"/><circle cx="328" cy="328" r="6"/>
      </g>
      <ellipse cx="196" cy="176" rx="28" ry="52" fill="#fff" opacity="0.22" transform="rotate(28 196 176)"/>
    </g>
    <path d="M244 92Q256 62 268 92Z" fill="#6a4120"/>
  </g>

  <!-- haze drifting across the whole frame -->
  <g filter="url(#blur)" fill="#f3ede1" opacity="0.65">
    <rect x="20" y="226" width="300" height="34" rx="17"/>
    <rect x="110" y="270" width="420" height="34" rx="17"/>
  </g>
  <g fill="#f6f1e7" opacity="0.94">
    <rect x="36" y="230" width="270" height="24" rx="12"/>
    <rect x="124" y="274" width="390" height="24" rx="12"/>
    <rect x="70" y="318" width="230" height="24" rx="12"/>
    <rect x="360" y="318" width="200" height="24" rx="12" opacity="0.7"/>
  </g>

  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" fill="#fff" filter="url(#shadow)">
    <text x="318" y="92" font-size="40" font-weight="800" letter-spacing="-1">I’m going</text>
    <text x="318" y="136" font-size="40" font-weight="800" letter-spacing="-1">hazelnuts!</text>
    <text x="320" y="172" font-size="22" font-weight="600" >Singapore PSI, live</text>
    <text x="320" y="202" font-size="18" font-weight="500" >Alerts when the haze rolls in</text>
  </g>
</svg>
